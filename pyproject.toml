[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "santa-isabel-yolo"
version = "0.1.0"
description = "Cobertura de nieve y hielo visible en el Nevado Santa Isabel con YOLO Segmentation"
requires-python = ">=3.11"
# Las dependencias se instalan con requirements-app.txt (servicio) o environment-train.yml (entrenamiento).
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "datos_reales: requiere data/datasets/<version> extraído (se omite si falta)",
    "cache_productor: requiere la caché del generador mensual (se omite si falta)",
    "paquete_real: requiere un paquete de modelo publicado en models/ (se omite si falta)",
]
