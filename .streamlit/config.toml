# Configuración de Streamlit para local y Render.
[server]
headless = true
maxUploadSize = 60          # MB; coincide con [limites].max_bytes de configs/experimento.toml
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f6fb2"

[client]
toolbarMode = "minimal"
